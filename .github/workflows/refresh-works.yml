# Refreshes data/works.json (the Rings on barackliu.org) on the 1st of every month.
# Pulls novel chapters (Qidian), devlog videos (Bilibili) and allow-listed repos (GitHub);
# hand-curated items, exclusions and the repo allow-list come from .github/works/manual.json.
# If a source is down, the previous items for it are kept.
# Commits only when the data actually changed; GitHub Pages then republishes on its own.
name: Refresh works data
on:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public works
        run: node .github/works/fetch_works.mjs --manual .github/works/manual.json --out data/works.json || [ $? -eq 2 ]
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/works.json; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/works.json
          git commit -m "Refresh works data ($(date -u +%Y-%m-%d))"
          git push
